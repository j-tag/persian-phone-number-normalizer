name: Publish npm Package

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          registry-url: https://registry.npmjs.org/
      - run: bun check
      - run: bun install
      - run: bun test --concurrent --randomize
      - run: bun run build      
      - run: tsc
      - run: bun pm pack
      - run: bun publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
