name: Publish npm Package

on:
  release:
    types: [created]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
          registries: |
            https://registry.npmjs.org/

      - run: bun install
      - run: bun check
      - run: bun test --concurrent --randomize
      - run: bun run build
      - run: tsc
      - run: bun pm pack
      - run: bun publish
